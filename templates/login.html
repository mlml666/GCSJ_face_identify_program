<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 课堂人脸验证考勤系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm" style="width: 22rem;">
      <div class="card-body p-4">
        <h5 class="card-title text-center mb-1">课堂人脸验证考勤系统</h5>
        <p class="text-center text-muted small mb-4">Face Attendance System · V1.0</p>

        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-danger py-2 small mb-3" role="alert">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label small" for="username">账号</label>
            <input class="form-control" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label small" for="password">密码</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">登 录</button>
        </form>

        <hr class="my-3">
        <p class="text-muted small mb-0">
          演示账号：admin / admin123　teacher / teacher123<br>
          仅用于流程演示，正式版需替换为数据库账号。
        </p>
      </div>
    </div>
  </div>
</body>
</html>
