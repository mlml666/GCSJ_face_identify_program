<!doctype html>
<!--
  工作台首页（demo）
  用途：登录成功后的落地页，占位展示后续要做的五个页面
  数据来源：app.py 的 index 视图，传入 session 中的 user（username / name / role）
  说明：卡片仅作导航占位，实际页面在后续 feature 分支实现（P0-05 ~ P0-12）
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · 课堂人脸验证考勤系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- 顶部导航：左侧系统名，右侧当前用户与退出入口 -->
  <nav class="navbar navbar-expand bg-white border-bottom">
    <div class="container">
      <span class="navbar-brand mb-0">课堂人脸验证考勤系统</span>
      <div class="d-flex align-items-center gap-3 small">
        <span class="text-muted">{{ user.name }}（{{ user.role }}）</span>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('logout') }}">退出登录</a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- 登录成功提示：验收演示时可作为「已登录」的可视证据 -->
    <div class="alert alert-success py-2 small">登录成功，欢迎 {{ user.name }}。</div>

    <h6 class="text-muted mb-3">后续页面（demo 阶段仅占位）</h6>

    <!-- 五个待开发页面：对应优先级清单 P0-05 ~ P0-12，实现后替换为可点击链接 -->
    <div class="row g-3">
      {% for item in ["发起考勤", "按名单点名", "学生管理", "考勤记录查询", "统计报表"] %}
        <div class="col-6 col-md-4">
          <div class="card h-100 text-center py-4">
            <div class="card-body py-0">
              <div class="small text-muted">{{ item }}</div>
              <div class="text-secondary small mt-2">待开发</div>
            </div>
          </div>
        </div>
      {% endfor %}
    </div>
  </main>
</body>
</html>
